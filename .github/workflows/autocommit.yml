name: Auto Commit DSA

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  autocommit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository using PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run DSA generation script
        run: python scripts/generate_dsa.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 🔑 Force BOTH author and committer
      - name: Configure git identity
        run: |
          git config user.name "OMCHOKSI108"
          git config user.email "165450225+OMCHOKSI108@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Commit changes as OMCHOKSI108
        env:
          GIT_AUTHOR_NAME: OMCHOKSI108
          GIT_AUTHOR_EMAIL: 165450225+OMCHOKSI108@users.noreply.github.com
          GIT_COMMITTER_NAME: OMCHOKSI108
          GIT_COMMITTER_EMAIL: 165450225+OMCHOKSI108@users.noreply.github.com
        run: |
          git add .
          git commit -m "Daily DSA solutions $(date -u +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push changes
        run: git push
