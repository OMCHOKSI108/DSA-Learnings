name: Auto Commit DSA

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  autocommit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository using PAT TOKEN
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run DSA generation script
        run: python scripts/generate_dsa.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Configure git identity (commit as OMCHOKSI108)
        run: |
          git config user.name "OMCHOKSI108"
          git config user.email "165450225+OMCHOKSI108@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add .
          git commit -m "Daily DSA solutions $(date -u +'%Y-%m-%d')" || echo "No changes to commit"

      - name: Push changes using PAT
        run: git push
