name: Auto Commit DSA

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  autocommit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository using PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0
          persist-credentials: false  # Don't let checkout override git credentials

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run DSA generation script
        run: python scripts/generate_dsa.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 🔑 Force BOTH author and committer
      - name: Configure git identity
        run: |
          git config --global user.name "OMCHOKSI108"
          git config --global user.email "165450225+OMCHOKSI108@users.noreply.github.com"
          git config --global commit.gpgsign false

      - name: Commit and Push as OMCHOKSI108
        run: |
          git add .
          if ! git diff --staged --quiet; then
            git -c user.name="OMCHOKSI108" -c user.email="165450225+OMCHOKSI108@users.noreply.github.com" commit -m "Daily DSA solutions $(date -u +'%Y-%m-%d')"
            git remote set-url origin https://OMCHOKSI108:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git
            git push
          else
            echo "No changes to commit"
          fi
